<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="HSR Utility">
  <!-- Full-bleed square, deliberately NOT rounded: iOS and Android apply their own
       mask. Rounding here would leave transparent corners, which iOS fills with black. -->
  <rect width="512" height="512" fill="#c9a84c"/>
  <text x="256" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="300" fill="#12132a">H</text>
</svg>
