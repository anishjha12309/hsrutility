<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" role="img" aria-label="HSR Utility">
  <!-- Full-bleed square and deliberately NOT rounded: iOS and Android apply their
       own mask. Rounding here would leave transparent corners, which iOS fills
       with black. Source for icon-192/512 and apple-touch-icon.
       Geometry mirrors src/components/Logo.astro. -->
  <rect width="32" height="32" fill="#0B4FFF"/>
  <circle cx="16" cy="10.5" r="7.5" fill="#FFFFFF" opacity="0.62"/>
  <circle cx="11" cy="19" r="7.5" fill="#FFFFFF" opacity="0.62"/>
  <circle cx="21" cy="19" r="7.5" fill="#FFFFFF" opacity="0.62"/>
</svg>
