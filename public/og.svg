<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
  <mask id="ogmark">
    <rect width="32" height="32" fill="#000"/>
    <circle cx="16" cy="10.5" r="7.5" fill="#fff" opacity="0.62"/>
    <circle cx="11" cy="19" r="7.5" fill="#fff" opacity="0.62"/>
    <circle cx="21" cy="19" r="7.5" fill="#fff" opacity="0.62"/>
  </mask>
  </defs>

  <rect width="1200" height="630" fill="#0B4FFF"/>
  <ellipse cx="980" cy="120" rx="470" ry="400" fill="url(#glow)"/>

  <!-- Brand row -->
  <g transform="translate(84, 74)">
    <svg x="0" y="0" width="56" height="56" viewBox="0 0 32 32">
      <rect width="32" height="32" fill="#FFFFFF" mask="url(#ogmark)"/>
    </svg>
    <text x="74" y="40" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">HSR Utility</text>
  </g>

  <rect x="84" y="176" width="420" height="1" fill="url(#hairline)"/>

  <!-- Headline — Georgia is the declared fallback for Instrument Serif, so the
       card carries the site's serif display voice without embedding the face. -->
  <text x="84" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#FFFFFF">Screens worth <tspan font-style="italic">looking</tspan> at.</text>
  <text x="84" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#C9D4FF">Made for someone specific.</text>

  <!-- Sub -->
  <text x="84" y="462" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#C9D4FF">Wallpapers, live wallpapers and ringtones for specific cultural audiences.</text>

  <!-- Footer row -->
  <text x="84" y="556" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Arul</text>
  <text x="1116" y="556" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#C9D4FF">hsrutility.com</text>
</svg>